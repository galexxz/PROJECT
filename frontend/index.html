<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bayanihan System</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="sidebar">
  <h2>Bayanihan</h2>

  <a onclick="setView('dashboard')">
    Tasks <span id="taskLabel">(0)</span>
  </a>

  <a onclick="setView('ongoing')">
    Ongoing <span id="ongoingLabel">(0)</span>
  </a>

  <a onclick="setView('completed')">
    Completed <span id="completedLabel">(0)</span>
  </a>

  <a onclick="setView('requests')">
    My Requests <span id="requestLabel">(0)</span>
  </a>
</div>

<div class="main">

  <div class="topbar">
    <h2>Bayanihan Dashboard</h2>

    <div>
      <button onclick="switchUser()">Switch User</button>
      <span id="userDisplay"></span>
    </div>
  </div>

  <div class="cards">
    <div class="card">
      <h3>Tasks</h3>
      <p id="total">0</p>
    </div>

    <div class="card">
      <h3>Ongoing</h3>
      <p id="ongoing">0</p>
    </div>

    <div class="card">
      <h3>Completed</h3>
      <p id="completed">0</p>
    </div>
  </div>

  <div class="form-box" id="createBox">

    <h3>Create Task</h3>

    <input id="title" placeholder="Title">
    <input id="desc" placeholder="Description">

    <!-- ✅ FIXED CITY -->
    <input value="Lucena City" disabled>

    <!-- ✅ BARANGAY DROPDOWN -->
    <select id="barangay">
      <option value="" disabled selected>Select Barangay</option>
      <option>Barangay 1 (Pob.)</option>
      <option>Barangay 2 (Pob.)</option>
      <option>Barangay 3 (Pob.)</option>
      <option>Barangay 4 (Pob.)</option>
      <option>Barangay 5 (Pob.)</option>
      <option>Barangay 6 (Pob.)</option>
      <option>Barangay 7 (Pob.)</option>
      <option>Barangay 8 (Pob.)</option>
      <option>Barangay 9 (Pob.)</option>
      <option>Barangay 10 (Pob.)</option>
      <option>Barangay 11 (Pob.)</option>
      <option>Barangay 12 (Pob.)</option>
      <option>Barangay 13 (Pob.)</option>
      <option>Barangay 14 (Pob.)</option>
      <option>Bocohan</option>
      <option>Cotta</option>
      <option>Dalahican</option>
      <option>Gulang-Gulang</option>
      <option>Ibabang Dupay</option>
      <option>Ibabang Iyam</option>
      <option>Ibabang Talim</option>
      <option>Ilayang Dupay</option>
      <option>Ilayang Iyam</option>
      <option>Ilayang Talim</option>
      <option>Isabang</option>
      <option>Mayao Castillo</option>
      <option>Mayao Crossing</option>
      <option>Mayao Kanluran</option>
      <option>Mayao Parada</option>
      <option>Mayao Silangan</option>
      <option>Ransohan</option>
      <option>Salinas</option>
      <option>Talao-Talao</option>
    </select>

    <input id="deadline" type="datetime-local">

    <select id="urgency">
      <option value="low">Low Priority</option>
      <option value="medium">Medium Priority</option>
      <option value="high">High Priority</option>
    </select>

    <!-- CATEGORY -->
    <select id="category">
      <option value="" disabled selected>Category</option>
      <option value="errands">Errands</option>
      <option value="delivery">Delivery</option>
      <option value="school_help">School Help</option>
      <option value="emergency">Emergency Help</option>
      <option value="tech_support">Tech Support</option>
      <option value="household">Household Help</option>
      <option value="others">Others</option>
    </select>

    <!-- OFFER -->
    <select id="offerType" onchange="handleOfferType()">
      <option value="">Offer Type</option>
      <option value="cash">Cash</option>
      <option value="goods">Goods</option>
    </select>

    <input id="cashInput" placeholder="Cash" style="display:none;">
    <input id="goodsInput" placeholder="Goods" style="display:none;">

    <button onclick="addTask()">Add Task</button>

  </div>

  <h3>Feed</h3>
  <div id="taskList"></div>

</div>

<script src="script.js"></script>
</body>
</html>
